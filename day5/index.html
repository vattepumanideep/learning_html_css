<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Forms in HTML</h1>

    <form>
        <input type="text" placeholder="Enter Username" required>
        <input type="password" placeholder="Password" required>
        <input type="submit" value="log in" required>
        <input type="date" >
        <input type="datetime-local">
        <input type="number">
        <input type="color">

        <h2>Gender</h2>

        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="others">
        <label for="others">others</label>

        <h3>Hobbies</h3>

        <input type="checkbox" name="Hobbies" id="Playing CHESS">
        <label for="Playing CHESS">Playing CHESS</label>

        <input type="checkbox" name="Hobbies" id="Running">
        <label for="Running">Running</label>

        <input type="checkbox" name="Hobbies" id="Exercise">
        <label for="Exercise">Exercise</label>


        <select name="" id="">
            <option value="">English</option>
            <option value="">తెలుగు</option>
            <option value="">हिन्दी</option>
            <option value="">தமிழ்</option>
            <option value="">اردو</option>
        </select>


        <textarea name="" id="" rows="40" cols="40"></textarea>




    </form>
    
</body>
</html>
